name: agidetogo-app
region: fra1

services:
  - name: web
    environment_slug: python
    instance_size_slug: basic-xxs
    instance_count: 1
    source_dir: /
    github:
      repo: "Louistatch/ongagide"
      branch: "master"
    build_command: pip install -r requirements.txt && if [ "$DISABLE_COLLECTSTATIC" != "1" ]; then python manage.py collectstatic --noinput; fi
    run_command: mkdir -p /data && python manage.py migrate --noinput && gunicorn agide.wsgi:application --bind 0.0.0.0:$PORT
    http_port: 8080
    routes:
      - path: /
    volumes:
      - name: sqlite-data
        mount_path: /data
    envs:
      - key: DISABLE_COLLECTSTATIC
        value: "1"
        scope: RUN_AND_BUILD_TIME
      - key: DEBUG
        value: "False"
        scope: RUN_AND_BUILD_TIME
      - key: SECRET_KEY
        value: "django-insecure-^t+)smnf$)a*&kr0x$-d=q+0vtl%al=b0)3v9d)#o8uvcmftg&"
        scope: RUN_AND_BUILD_TIME
      - key: ALLOWED_HOSTS
        value: "*.ondigitalocean.app,agidetogo.com,www.agidetogo.com"
        scope: RUN_AND_BUILD_TIME
      - key: DO_SQLITE_PATH
        value: "/data/db.sqlite3"
        scope: RUN_AND_BUILD_TIME

volumes:
  - name: sqlite-data
    size_gigabytes: 1 