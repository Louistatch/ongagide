name: agidetogo-app
region: fra1

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

domains:
  - domain: www.agidetogo.com
    type: PRIMARY
  - domain: agidetogo.com
    type: ALIAS

features:
  - buildpack-stack=ubuntu-22

services:
  - name: web
    environment_slug: python
    instance_size_slug: basic-xxs
    instance_count: 1
    source_dir: /
    github:
      repo: "Louistatch/ongagide"
      branch: "master"
    build_command: pip install -r requirements.txt && if [ "$DISABLE_COLLECTSTATIC" != "1" ]; then python manage.py collectstatic --noinput; fi
    run_command: |
      mkdir -p /data
      chmod -R a+rwx /data
      python manage.py migrate --noinput
      gunicorn agide.wsgi:application --bind 0.0.0.0:$PORT
    http_port: 8080
    routes:
      - path: /
    envs:
      - key: DISABLE_COLLECTSTATIC
        value: "1"
        scope: RUN_AND_BUILD_TIME
      - key: DEBUG
        value: "False"
        scope: RUN_AND_BUILD_TIME
      - key: SECRET_KEY
        value: "django-insecure-^t+)smnf$)a*&kr0x$-d=q+0vtl%al=b0)3v9d)#o8uvcmftg&"
        scope: RUN_AND_BUILD_TIME
      - key: ALLOWED_HOSTS
        value: "*"
        scope: RUN_AND_BUILD_TIME
      - key: DO_SQLITE_PATH
        value: "/data/db.sqlite3"
        scope: RUN_AND_BUILD_TIME
    volumes:
      - sqlite-data

# NOTE: Persistent storage must be attached via the App Platform UI under "Volumes"
# Attach a volume named 'sqlite-data' to mount at /data with at least 1 GB size.

volumes:
  - name: sqlite-data
    mount_path: /data
    size_gigabytes: 1