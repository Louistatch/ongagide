{% extends 'base/base.html' %}
{% load crispy_forms_tags %}

{% block title %}Mon Profil - AGIDE{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-8">Mon Profil</h1>
        
        <div class="bg-white rounded-lg shadow-md p-6">
            <form method="post" enctype="multipart/form-data" class="space-y-6">
                {% csrf_token %}
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <h2 class="text-xl font-semibold mb-4">Informations personnelles</h2>
                        {{ user_form|crispy }}
                    </div>
                    
                    <div>
                        <h2 class="text-xl font-semibold mb-4">Profil</h2>
                        {{ profile_form|crispy }}
                    </div>
                </div>
                
                <div class="flex justify-end">
                    <button type="submit" class="bg-primary text-white py-2 px-6 rounded hover:bg-primary-dark">
                        Enregistrer les modifications
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
